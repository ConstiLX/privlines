<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Schul-Registrierung – PrivLines</title>

    <link rel="manifest" href="/manifest.webmanifest">
    <link
        rel="icon"
        type="image/png"
        href="/logo_black.png"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(255, 255, 255, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(255, 255, 255, 0.06),
                    transparent 35%
                ),
                #050505;

            color: #ffffff;

            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 25px;
        }

        .card {
            width: 100%;
            padding: 38px 34px;

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;

            background:
                rgba(255, 255, 255, 0.045);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55);

            text-align: center;
        }

        .logo {
            width: 155px;
            max-width: 70%;
            height: auto;

            display: block;
            margin: 0 auto 25px;

            object-fit: contain;
        }

        .school-label {
            display: inline-block;

            padding: 6px 13px;

            margin-bottom: 18px;

            border-radius: 999px;

            background: #ffffff;
            color: #000000;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.4px;
        }

        h1 {
            font-size: 27px;
            font-weight: 700;

            margin-bottom: 9px;

            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.58);

            font-size: 14px;
            line-height: 1.5;

            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;

            color: rgba(255, 255, 255, 0.78);
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 13px;

            outline: none;

            background:
                rgba(255, 255, 255, 0.055);

            color: #ffffff;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.32);
        }

        input:focus {
            border-color: rgba(255, 255, 255, 0.5);

            background:
                rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.06);
        }

        button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;
            border-radius: 13px;

            background: #ffffff;
            color: #000000;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            display: none;

            margin-top: 17px;
            padding: 11px 13px;

            border-radius: 11px;

            background:
                rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.13);

            color: #ffffff;

            font-size: 13px;
            line-height: 1.4;
        }

        .switch {
            margin-top: 24px;

            color: rgba(255, 255, 255, 0.52);

            font-size: 13px;
            line-height: 1.7;
        }

        .switch a {
            color: #ffffff;

            font-weight: 600;

            text-decoration: none;

            transition: opacity 0.2s ease;
        }

        .switch a:hover {
            opacity: 0.65;
        }

        .footer {
            margin-top: 24px;

            color: rgba(255, 255, 255, 0.28);

            font-size: 11px;
        }

        @media (max-width: 500px) {

            .container {
                padding: 16px;
            }

            .card {
                padding: 30px 23px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                width: 140px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <img
                src="/text_logo2.png"
                alt="PrivLines"
                class="logo"
            >

            <div class="school-label">
                SCHOOL EDITION
            </div>

            <h1>
                Konto erstellen
            </h1>

            <p class="subtitle">
                Erstelle deinen PrivLines Schul-Account.
            </p>

            <form id="registerForm">

                <div class="input-group">

                    <label for="username">
                        Benutzername
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Benutzername"
                        minlength="3"
                        maxlength="30"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="password">
                        Passwort
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Passwort"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="passwordConfirm">
                        Passwort wiederholen
                    </label>

                    <input
                        type="password"
                        id="passwordConfirm"
                        name="passwordConfirm"
                        placeholder="Passwort wiederholen"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button type="submit">
                    Schul-Account erstellen
                </button>

            </form>

            <div id="message"></div>

            <div class="switch">

                Du hast schon einen Schul-Account?

                <a href="/school-login.html">
                    Zum Schul-Login
                </a>

                <br>

                 Standard-Account?

                <a href="/register.html">
                    Standard Registrierung
                </a>

            </div>

            <div class="footer">
                © PrivLines
            </div>

        </div>

    </div>

    <script src="/school-register.js"></script>

</body>

</html>
